<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ filename }} · CAD2KML Pro Shared Map Workstation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #080c14;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #f8fafc;
    }
    .share-header {
      height: 54px;
      background: rgba(9, 13, 22, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      z-index: 1000;
      flex-shrink: 0;
    }
    .share-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .brand-badge-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(99, 102, 241, 0.25));
      border: 1px solid rgba(56, 189, 248, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
    }
    .share-title {
      font-weight: 700;
      font-size: 0.92rem;
      color: #f8fafc;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .share-title-sub {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      padding: 1px 4px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 4px;
    }
    .meta-divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.12);
    }
    .share-file-badge {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-family: 'JetBrains Mono', monospace;
    }
    .share-expiry-badge {
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.22);
      color: #fde047;
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
      animation: pulseSlow 2s infinite;
    }
    @keyframes pulseSlow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .share-actions {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }
    .btn-download-shared {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 0.42rem 0.95rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
      transition: all 0.15s ease;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .btn-download-shared:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.45);
      background: linear-gradient(135deg, #34d399 0%, #059669 100%);
    }
    .btn-secondary-shared {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 0.42rem 0.85rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn-secondary-shared:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      transform: translateY(-1px);
    }
    .share-map-wrapper {
      flex: 1;
      position: relative;
      width: 100%;
      height: calc(100vh - 54px);
    }
    #shareMap {
      width: 100%;
      height: 100%;
      background: #080c14;
    }
  </style>
</head>
<body class="dark-theme workstation-theme">

  <!-- Top Enterprise Glass Bar -->
  <header class="share-header">
    <div class="share-brand">
      <div class="brand-badge-icon" title="CAD2KML Geospatial Studio">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
      </div>
      <div class="share-title">
        <span>CAD2KML</span>
        <span class="share-title-sub">STUDIO</span>
      </div>

      <div class="meta-divider"></div>

      <div class="share-file-badge" title="Source CAD Drawing">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
        </svg>
        <span>{{ filename }}</span>
      </div>

      <div class="share-expiry-badge" title="Temporary Session Expiry">
        <span class="pulse-dot"></span>
        <span>Expires in {{ expiry_str }}</span>
      </div>
    </div>

    <div class="share-actions">
      <a href="/api/share/{{ share_id }}/download" class="btn-download-shared" download>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Download {{ output_name }}</span>
      </a>
      <a href="/" target="_blank" class="btn-secondary-shared" title="Open CAD Converter Studio">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>New Conversion</span>
      </a>
    </div>
  </header>

  <!-- Interactive Map Workstation Viewport -->
  <div class="share-map-wrapper">

    <!-- Floating Frosted Glass Dock -->
    <div class="floating-glass-dock" id="glassDock">
      <div class="glass-search-box">
        <div class="search-icon-wrapper">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>
        <input type="text" id="mapSearchInput" class="glass-search-input" placeholder="Search coordinates, cities, landmarks...">
        <button type="button" class="glass-search-btn" id="mapSearchBtn">
          <span>Search</span>
          <kbd class="kbd-hint">↵</kbd>
        </button>
      </div>

      <div class="dock-separator"></div>

      <div class="glass-dock-actions">
        <!-- Fit Bounds -->
        <button type="button" class="glass-dock-btn" id="fitBoundsBtn" title="Fit to Drawing Extents">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
          </svg>
          <span>Fit Drawing</span>
        </button>

        <!-- Measurement Tool -->
        <button type="button" class="glass-dock-btn" id="measureBtn" title="Measure Geodesic Distance">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.3 8.7 8.7 21.3a2.12 2.12 0 0 1-3 0L2.7 18.3a2.12 2.12 0 0 1 0-3L15.3 2.7a2.12 2.12 0 0 1 3 0l3 3a2.12 2.12 0 0 1 0 3Z"></path>
            <path d="m14.5 3.5 2 2"></path>
            <path d="m11.5 6.5 2 2"></path>
            <path d="m8.5 9.5 2 2"></path>
            <path d="m5.5 12.5 2 2"></path>
          </svg>
          <span>Measure</span>
        </button>

        <!-- Fullscreen Mode Toggle -->
        <button type="button" class="glass-dock-btn" id="fullscreenBtn" title="Toggle Fullscreen Map Workstation">
          <svg id="fullscreenIconSvg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
          <span id="fullscreenText">Fullscreen</span>
        </button>
      </div>
    </div>

    <!-- Active Measurement Floating Banner -->
    <div class="measure-banner" id="measureBanner">
      <span>Distance: <strong id="measureDistanceVal">0.0 m</strong></span>
      <button type="button" class="btn-measure-action" id="measureClearBtn">Clear</button>
      <button type="button" class="btn-measure-action" id="measureFinishBtn">Finish</button>
    </div>

    <!-- Feature Inspector Hover Card -->
    <div class="feature-inspector-card" id="featureInspectorCard">
      <div class="inspector-title">
        <span id="inspectorIcon">📐</span>
        <span id="inspectorLayer">Layer: Default</span>
      </div>
      <div class="inspector-row">
        <span>Type:</span>
        <span class="val" id="inspectorType">Polyline</span>
      </div>
      <div class="inspector-row" id="inspectorLengthRow">
        <span>Length:</span>
        <span class="val" id="inspectorLength">0 m</span>
      </div>
      <div class="inspector-row" id="inspectorVerticesRow">
        <span>Vertices:</span>
        <span class="val" id="inspectorVertices">0</span>
      </div>
    </div>

    <!-- Main Leaflet Map -->
    <div id="shareMap"></div>

    <!-- Drawing Layers Panel -->
    <div class="layer-panel" id="layerPanel" style="display:none;">
      <div class="layer-panel-header">
        <div class="layer-panel-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
          <span>CAD Layers</span>
        </div>
        <div class="layer-quick-actions">
          <button type="button" class="layer-quick-btn" id="layerAllOnBtn" title="Show all layers">All</button>
          <span class="sep">/</span>
          <button type="button" class="layer-quick-btn" id="layerAllOffBtn" title="Hide all layers">None</button>
          <button type="button" class="layer-panel-toggle" id="layerPanelToggle" title="Toggle panel">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
        </div>
      </div>
      <div class="layer-panel-body" id="layerPanelBody"></div>
    </div>

    <!-- Live Coordinate Status Bar -->
    <div class="map-status-bar" id="mapStatusBar">
      <div class="map-status-left">
        <span class="telemetry-pill">
          <span class="telemetry-label">COORD</span>
          <span class="map-status-val" id="statusCoords">--</span>
        </span>
        <span class="telemetry-pill">
          <span class="telemetry-label">UTM</span>
          <span class="map-status-val" id="statusUtm">--</span>
        </span>
      </div>
      <div class="map-status-right">
        <span class="telemetry-pill">
          <span class="telemetry-label">ZOOM</span>
          <span class="map-status-val" id="statusZoom">--</span>
        </span>
        <span class="telemetry-tag">
          <span class="status-live-dot"></span>
          <span>Shared CAD Workstation</span>
        </span>
      </div>
    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const SHARE_ID = "{{ share_id }}";
    let map;
    let geojsonLayerGroup;
    let currentGeoJSON = null;
    let layerVisibility = {};
    let layerOpacity = {};
    let layerColors = {};
    let isMeasurementActive = false;
    let measurePoints = [];
    let measureMarkers = [];
    let measurePolyline = null;

    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      loadSharedData();
      initDockControls();
    });

    function initMap() {
      map = L.map('shareMap', { zoomControl: false, attributionControl: true, maxZoom: 22 }).setView([14.055, 79.526], 14);
      L.control.zoom({ position: 'topleft' }).addTo(map);

      // High-res Esri World Imagery Basemap (maxNativeZoom: 18 auto-magnifies deep zoom levels seamlessly)
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxNativeZoom: 18,
        maxZoom: 22,
        attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
      }).addTo(map);

      geojsonLayerGroup = L.featureGroup().addTo(map);

      // Automatic container resize detection to guarantee complete tile coverage
      if (window.ResizeObserver) {
        const shareMapEl = document.getElementById('shareMap');
        const ro = new ResizeObserver(() => {
          if (map) map.invalidateSize({ debounceMoveEngine: true });
        });
        if (shareMapEl) ro.observe(shareMapEl);
      }
      window.addEventListener('resize', () => {
        if (map) map.invalidateSize();
      });
      document.addEventListener('fullscreenchange', () => {
        const svg = document.getElementById('fullscreenIconSvg');
        const text = document.getElementById('fullscreenText');
        const isFs = !!document.fullscreenElement;
        if (svg) {
          svg.innerHTML = isFs
            ? '<polyline points="4 14 10 14 10 20"></polyline><polyline points="20 10 14 10 14 4"></polyline><line x1="14" y1="10" x2="21" y2="3"></line><line x1="3" y1="21" x2="10" y2="14"></line>'
            : '<polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line>';
        }
        if (text) {
          text.innerText = isFs ? 'Exit Fullscreen' : 'Fullscreen';
        }
        if (map) {
          map.invalidateSize();
          setTimeout(() => map.invalidateSize(), 100);
          setTimeout(() => map.invalidateSize(), 300);
        }
      });

      map.on('mousemove', onMapMouseMove);
      map.on('zoomend', () => {
        updateStatusBarZoom();
        updateLabelSizes();
      });
    }

    async function loadSharedData() {
      try {
        const resp = await fetch(`/api/share/${SHARE_ID}/geojson`);
        if (!resp.ok) {
          window.location.reload();
          return;
        }
        currentGeoJSON = await resp.json();
        renderMapFeatures(currentGeoJSON, true);
        populateLayerPanel(currentGeoJSON);
      } catch (err) {
        console.error('Failed to load shared geojson:', err);
      }
    }

    let currentMedianTextHeight = 10.0;

    function getLabelTier(text, textHeight, medianHeight) {
      const str = (text || '').trim();
      const h = Number(textHeight) || 0;
      const med = Number(medianHeight) || 10.0;

      // Tier 1: Major drawing titles, large text annotations (h >= 1.35 * median), or non-chainage words
      if (h >= med * 1.35 || (!/^KM\b/i.test(str) && !/^\d+(\.\d+)?$/.test(str) && str.length > 8)) {
        return 1;
      }
      // Tier 2: Whole Kilometer Milestones (e.g., KM 1.000, KM 2.000, KM 1, KM 2)
      if (/^KM\s*\d+(\.000?)?$/i.test(str) || /\.000$/i.test(str)) {
        return 2;
      }
      // Tier 3: 500m Intervals (e.g., KM 0.500, KM 1.500, KM 2.500)
      if (/^KM\s*\d+\.[50]00?$/i.test(str) || /\.[50]00$/i.test(str)) {
        return 3;
      }
      // Tier 4: 200m Intervals (e.g., .200, .400, .600, .800)
      if (/^KM\s*\d+\.[2468]00?$/i.test(str) || /\.[2468]00$/i.test(str)) {
        return 4;
      }
      // Tier 5: Detailed 100m chainage and all minor stations
      return 5;
    }

    function calculateLabelFontSize(textHeight, labelScale, zoom, medianHeight) {
      const currentZoom = (zoom !== undefined && zoom !== null) ? zoom : (map ? map.getZoom() : 15);
      const zoomDiff = currentZoom - 15;
      const zoomFactor = zoomDiff >= 0 ? Math.pow(1.22, zoomDiff) : Math.pow(1.14, zoomDiff);

      let cadHeightFactor = 1.0;
      const h = Number(textHeight);
      const med = Number(medianHeight) || 10.0;
      if (h > 0 && med > 0) {
        const ratio = h / med;
        cadHeightFactor = Math.max(0.65, Math.min(2.0, Math.sqrt(ratio)));
      }

      const basePx = 13.5;
      const calculatedPx = basePx * (labelScale || 0.7) * zoomFactor * cadHeightFactor;
      return Math.max(8, Math.min(38, Math.round(calculatedPx)));
    }

    function renderMapFeatures(geojson, shouldFit = false) {
      if (!geojson || !geojson.features) return;
      geojsonLayerGroup.clearLayers();

      const textHeights = (geojson.features || [])
        .filter(f => f.properties && f.properties.type === 'text' && Number(f.properties.text_height) > 0)
        .map(f => Number(f.properties.text_height))
        .sort((a, b) => a - b);
      if (textHeights.length > 0) {
        currentMedianTextHeight = textHeights[Math.floor(textHeights.length / 2)];
      }

      const filtered = geojson.features.filter(f => {
        const lyr = f.properties.layer || 'Default';
        if (!layerColors[lyr]) {
          layerColors[lyr] = f.properties.stroke || f.properties.color || f.properties.label_color || '#ef4444';
        }
        return layerVisibility[lyr] !== false;
      });

      const currentZoom = map.getZoom();

      const layer = L.geoJSON({ type: 'FeatureCollection', features: filtered }, {
        style: (feature) => {
          const props = feature.properties;
          const lyr = props.layer || 'Default';
          const alpha = layerOpacity[lyr] !== undefined ? layerOpacity[lyr] : 1.0;
          return {
            color: props.stroke || '#ef4444',
            weight: props['stroke-width'] || 2.5,
            opacity: 0.9 * alpha,
            fillColor: props.fill || '#ef4444',
            fillOpacity: (props['fill-opacity'] || 0.1) * alpha,
            fill: !!props.filled
          };
        },
        pointToLayer: (feature, latlng) => {
          const props = feature.properties;
          const lyr = props.layer || 'Default';
          const alpha = layerOpacity[lyr] !== undefined ? layerOpacity[lyr] : 1.0;

          if (props.type === 'text') {
            const textHeight = Number(props.text_height) || 0;
            const rotation = Number(props.rotation) || 0;
            const anchorX = (props.anchor_x !== undefined && props.anchor_x !== null) ? Number(props.anchor_x) : 0.0;
            const anchorY = (props.anchor_y !== undefined && props.anchor_y !== null) ? Number(props.anchor_y) : 0.5;
            const pctX = Math.round(anchorX * 100);
            const pctY = Math.round(anchorY * 100);
            const tier = getLabelTier(props.title, textHeight, currentMedianTextHeight);
            const fontSize = calculateLabelFontSize(textHeight, 0.7, currentZoom, currentMedianTextHeight);

            let cssAngle = (-rotation) % 360;
            if (cssAngle < 0) cssAngle += 360;
            const transformStyle = `transform-origin: ${pctX}% ${pctY}%; transform: translate(-${pctX}%, -${pctY}%) rotate(${cssAngle}deg);`;

            return L.marker(latlng, {
              icon: L.divIcon({
                className: 'map-text-label',
                html: `<span class="cad-label-text" data-text-height="${textHeight}" data-tier="${tier}" data-anchor-x="${anchorX}" data-anchor-y="${anchorY}" data-rotation="${rotation}" style="color: ${props.label_color || '#ff0000'}; font-size: ${fontSize}px; opacity: ${alpha}; ${transformStyle}">${escapeHtml(props.title || '')}</span>`,
                iconSize: [0, 0],
                iconAnchor: [0, 0]
              })
            });
          }

          const stationMarker = L.circleMarker(latlng, {
            radius: 4.5,
            className: 'survey-station-marker',
            fillColor: props.color || '#10b981',
            color: '#1e293b',
            weight: 1.5,
            opacity: alpha,
            fillOpacity: 1.0 * alpha
          });

          if (props.title || props.layer) {
            stationMarker.bindTooltip(escapeHtml(props.title || `Station (${props.layer})`), {
              className: 'cad-station-tooltip',
              direction: 'top',
              offset: [0, -6],
              opacity: 0.95
            });
          }
          return stationMarker;
        },
        onEachFeature: (feature, lyr) => {
          lyr.on('click', (e) => {
            if (isMeasurementActive) {
              L.DomEvent.stopPropagation(e);
              addMeasurementPoint(e.latlng);
            }
          });
        }
      });

      if (map) map.invalidateSize();
      geojsonLayerGroup.addLayer(layer);
      if (shouldFit && geojsonLayerGroup.getLayers().length > 0) {
        map.fitBounds(geojsonLayerGroup.getBounds(), { padding: [40, 40], maxZoom: 18 });
      }
      updateLabelSizes();
    }

    function updateLabelSizes() {
      if (!map) return;
      const zoom = map.getZoom();
      const labels = Array.from(document.querySelectorAll('.cad-label-text'));
      if (labels.length === 0) return;

      labels.forEach(el => {
        const h = parseFloat(el.getAttribute('data-text-height')) || 0;
        const size = calculateLabelFontSize(h, 0.7, zoom, currentMedianTextHeight);
        el.style.fontSize = `${size}px`;
      });

      declutterLabelsByZoomAndCollision(labels, zoom);
    }

    function declutterLabelsByZoomAndCollision(labels, zoom) {
      // Sort labels by priority:
      // Lower tier = higher importance (Tier 1 is top priority)
      // Within same tier, larger text_height first, then alphabetical
      labels.sort((a, b) => {
        const tierA = parseInt(a.getAttribute('data-tier') || '5', 10);
        const tierB = parseInt(b.getAttribute('data-tier') || '5', 10);
        if (tierA !== tierB) return tierA - tierB;
        const ha = parseFloat(a.getAttribute('data-text-height')) || 0;
        const hb = parseFloat(b.getAttribute('data-text-height')) || 0;
        if (Math.abs(ha - hb) > 0.1) return hb - ha;
        return (a.textContent || '').localeCompare(b.textContent || '');
      });

      const occupied = [];

      labels.forEach(el => {
        const tier = parseInt(el.getAttribute('data-tier') || '5', 10);

        // Responsive Zoom LOD Visibility Thresholds:
        // zoom < 13: Tier 1 only (Major Titles / Large Landmarks)
        // zoom === 13: Tier 1 + Tier 2 (1km Milestones)
        // zoom === 14: Tier 1 + Tier 2 + Tier 3 (500m Intervals)
        // zoom === 15: Tier 1 + Tier 2 + Tier 3 + Tier 4 (200m Intervals)
        // zoom >= 16: All tiers (100m Detailed Stations)
        let allowedByZoom = true;
        if (zoom < 13 && tier > 1) allowedByZoom = false;
        else if (zoom === 13 && tier > 2) allowedByZoom = false;
        else if (zoom === 14 && tier > 3) allowedByZoom = false;
        else if (zoom === 15 && tier > 4) allowedByZoom = false;

        if (!allowedByZoom) {
          el.style.opacity = '0';
          el.style.pointerEvents = 'none';
          return;
        }

        const rect = el.getBoundingClientRect();
        if (rect.width === 0 || rect.height === 0) {
          el.style.opacity = '0';
          el.style.pointerEvents = 'none';
          return;
        }

        // Bounding safety padding to avoid visual collision
        const padX = 6;
        const padY = 3;
        const box = {
          left: rect.left - padX,
          right: rect.right + padX,
          top: rect.top - padY,
          bottom: rect.bottom + padY
        };

        let collides = false;
        for (let i = 0; i < occupied.length; i++) {
          const o = occupied[i];
          if (box.left < o.right && box.right > o.left && box.top < o.bottom && box.bottom > o.top) {
            collides = true;
            break;
          }
        }

        if (collides) {
          el.style.opacity = '0';
          el.style.pointerEvents = 'none';
        } else {
          el.style.opacity = '1';
          el.style.pointerEvents = 'auto';
          occupied.push(box);
        }
      });
    }

    function populateLayerPanel(geojson) {
      const panel = document.getElementById('layerPanel');
      const body = document.getElementById('layerPanelBody');
      if (!panel || !body || !geojson) return;

      const layers = [...new Set(geojson.features.map(f => f.properties.layer || 'Default'))].sort();
      if (layers.length === 0) return;

      body.innerHTML = '';
      layers.forEach(lyr => {
        const item = document.createElement('div');
        item.className = 'layer-item';
        item.innerHTML = `
          <div class="layer-item-top">
            <span class="layer-color-chip" style="background:${layerColors[lyr] || '#3b82f6'};"></span>
            <input type="checkbox" id="chk_${lyr}" class="layer-visibility-chk" checked>
            <label for="chk_${lyr}" class="layer-item-name">${lyr}</label>
          </div>
          <div class="layer-item-opacity">
            <input type="range" min="0" max="100" value="100" class="layer-opacity-slider" title="Opacity">
          </div>
        `;
        const chk = item.querySelector('.layer-visibility-chk');
        const sld = item.querySelector('.layer-opacity-slider');

        chk.addEventListener('change', () => {
          layerVisibility[lyr] = chk.checked;
          renderMapFeatures(currentGeoJSON, false);
        });
        sld.addEventListener('input', () => {
          layerOpacity[lyr] = parseFloat(sld.value) / 100;
          renderMapFeatures(currentGeoJSON, false);
        });

        body.appendChild(item);
      });
      panel.style.display = 'block';

      document.getElementById('layerPanelToggle')?.addEventListener('click', () => {
        body.style.display = body.style.display === 'none' ? 'block' : 'none';
      });
      document.getElementById('layerAllOnBtn')?.addEventListener('click', () => {
        layers.forEach(l => layerVisibility[l] = true);
        panel.querySelectorAll('.layer-visibility-chk').forEach(c => c.checked = true);
        renderMapFeatures(currentGeoJSON, false);
      });
      document.getElementById('layerAllOffBtn')?.addEventListener('click', () => {
        layers.forEach(l => layerVisibility[l] = false);
        panel.querySelectorAll('.layer-visibility-chk').forEach(c => c.checked = false);
        renderMapFeatures(currentGeoJSON, false);
      });
    }

    function initDockControls() {
      document.getElementById('fitBoundsBtn')?.addEventListener('click', () => {
        if (geojsonLayerGroup && geojsonLayerGroup.getLayers().length > 0) {
          map.fitBounds(geojsonLayerGroup.getBounds(), { padding: [40, 40], maxZoom: 18 });
        }
      });
      document.getElementById('measureBtn')?.addEventListener('click', toggleMeasurement);
      document.getElementById('measureClearBtn')?.addEventListener('click', clearMeasurement);
      document.getElementById('measureFinishBtn')?.addEventListener('click', toggleMeasurement);
      document.getElementById('fullscreenBtn')?.addEventListener('click', toggleFullscreen);

      // Search box
      const sInput = document.getElementById('mapSearchInput');
      const sBtn = document.getElementById('mapSearchBtn');
      const doSearch = async () => {
        const q = sInput.value.trim();
        if (!q) return;
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`);
          const data = await res.json();
          if (data && data.length > 0) {
            map.flyTo([parseFloat(data[0].lat), parseFloat(data[0].lon)], 16);
          }
        } catch (e) {
          console.error(e);
        }
      };
      sBtn?.addEventListener('click', doSearch);
      sInput?.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
    }

    function toggleMeasurement() {
      isMeasurementActive = !isMeasurementActive;
      const btn = document.getElementById('measureBtn');
      const banner = document.getElementById('measureBanner');
      if (isMeasurementActive) {
        btn?.classList.add('active');
        banner?.classList.add('active');
        map.getContainer().style.cursor = 'crosshair';
        map.on('click', onMapMeasureClick);
      } else {
        btn?.classList.remove('active');
        banner?.classList.remove('active');
        map.getContainer().style.cursor = '';
        map.off('click', onMapMeasureClick);
      }
    }

    function onMapMeasureClick(e) {
      if (!isMeasurementActive) return;
      addMeasurementPoint(e.latlng);
    }

    function addMeasurementPoint(latlng) {
      measurePoints.push(latlng);
      const m = L.circleMarker(latlng, { radius: 5, color: '#06b6d4', fillColor: '#ffffff', fillOpacity: 1, weight: 2 }).addTo(map);
      measureMarkers.push(m);

      if (measurePoints.length > 1) {
        if (measurePolyline) map.removeLayer(measurePolyline);
        measurePolyline = L.polyline(measurePoints, { color: '#06b6d4', weight: 3, dashArray: '6,6' }).addTo(map);
      }

      let totalDist = 0;
      for (let i = 0; i < measurePoints.length - 1; i++) {
        totalDist += measurePoints[i].distanceTo(measurePoints[i+1]);
      }
      const valEl = document.getElementById('measureDistanceVal');
      if (valEl) {
        valEl.innerText = totalDist >= 1000 ? `${(totalDist / 1000).toFixed(3)} km` : `${totalDist.toFixed(1)} m`;
      }
    }

    function clearMeasurement() {
      measurePoints = [];
      measureMarkers.forEach(m => map.removeLayer(m));
      measureMarkers = [];
      if (measurePolyline) map.removeLayer(measurePolyline);
      measurePolyline = null;
      const valEl = document.getElementById('measureDistanceVal');
      if (valEl) valEl.innerText = '0.0 m';
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
      if (map) {
        map.invalidateSize();
        requestAnimationFrame(() => map.invalidateSize());
        setTimeout(() => map.invalidateSize(), 100);
        setTimeout(() => map.invalidateSize(), 300);
      }
    }

    function onMapMouseMove(e) {
      const coords = document.getElementById('statusCoords');
      if (coords) {
        coords.innerText = `${e.latlng.lat.toFixed(5)}°N, ${e.latlng.lng.toFixed(5)}°E`;
      }
    }

    function updateStatusBarZoom() {
      const z = document.getElementById('statusZoom');
      if (z && map) {
        const zoom = map.getZoom();
        let lod = 'Detailed (100m)';
        if (zoom < 13) lod = 'Overview (Landmarks)';
        else if (zoom <= 14) lod = 'Milestones (1km/500m)';
        else if (zoom === 15) lod = 'Intervals (200m)';
        z.innerText = `${zoom} · ${lod}`;
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[s]);
    }
  </script>
</body>
</html>
