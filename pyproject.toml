[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dxf2kml"
version = "1.1.0"
description = "AutoCAD DXF/DWG to Google Earth KML/KMZ converter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ezdxf>=1.1,<2",        # recover reader, path/hatch helpers, NonUniformScalingError in ezdxf.math
    "pyproj>=3.4,<4",       # Transformer.transform(errcheck=), transform_bounds
    "shapely>=2.0,<3",      # vectorized constructors, polygonize_full, STRtree predicates
    "numpy>=1.24",
    "pydantic>=2,<3",       # Field(pattern=...)
    "pyyaml>=6",
    "loguru>=0.7",
    "typer>=0.9",
    "rich>=13",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
]
dev = [
    "pytest>=7",
    "httpx>=0.27",
    "psutil>=5.9",
    "ruff>=0.5",
]

[project.scripts]
dxf2kml = "dxf2kml.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["dxf2kml*", "web_app*"]

[tool.setuptools.package-data]
web_app = ["templates/*.html", "static/css/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501", "B008", "B905", "UP006", "UP007", "UP035", "UP045"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

