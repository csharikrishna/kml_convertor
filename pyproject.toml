[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dxf2kml"
version = "1.0.0"
description = "A production-grade AutoCAD DXF to Google Earth KML converter"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "ezdxf>=1.0.0",
    "pyproj>=3.0.0",
    "shapely>=1.8.0",
    "simplekml>=1.3.6",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "networkx>=2.6",
    "rich>=12.0.0",
    "typer>=0.7.0",
    "pydantic>=1.10.0",
    "loguru>=0.6.0",
    "pyyaml>=5.4",
]

[project.scripts]
dxf2kml = "dxf2kml.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["dxf2kml*", "web_app*"]

