<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Link Expired · CAD2KML Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #090d16 100%);
      font-family: 'Inter', system-ui, sans-serif;
      color: #f8fafc;
    }
    .expired-card {
      max-width: 480px;
      width: 90%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .expired-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      display: inline-block;
    }
    .expired-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #f1f5f9;
    }
    .expired-desc {
      font-size: 0.92rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .btn-return-home {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.65rem 1.4rem;
      border-radius: 8px;
      transition: all 0.15s ease;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .btn-return-home:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
    }
  </style>
</head>
<body>
  <div class="expired-card">
    <div class="expired-icon">⏳</div>
    <div class="expired-title">Shared Link Expired</div>
    <div class="expired-desc">
      This temporary map link has reached its time expiration or is no longer accessible.
      Please request a new temporary share link from the project owner.
    </div>
    <a href="/" class="btn-return-home">
      <span>🌐</span>
      <span>Open CAD2KML Converter</span>
    </a>
  </div>
</body>
</html>
